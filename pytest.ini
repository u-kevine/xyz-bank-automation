[pytest]
testpaths = tests
addopts =
    -v
    --alluredir=allure-results
    --allure-link-pattern=issue:https://github.com/u-kevine/xyz-bank-automation/blob/main/DEFECTS.md#{}
xfail_strict = true
markers =
    smoke: fast, critical-path checks
    regression: full regression suite
    manager: Bank Manager features (User Story 1)
    customer: Customer features (User Story 2)
